name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  backend:
    name: Backend (restore, build, tests, migration check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: whatthegym_ci
          POSTGRES_USER: wtg_ci
          POSTGRES_PASSWORD: wtg_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wtg_ci -d whatthegym_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WhatTheGym.sln

      - name: Build (warnings as errors)
        run: dotnet build WhatTheGym.sln -c Release --no-restore

      - name: Unit tests (Domain)
        run: dotnet test tests/Gym.Domain.Tests -c Release --no-build --logger "trx;LogFileName=domain.trx"

      - name: Unit tests (Application)
        run: dotnet test tests/Gym.Application.Tests -c Release --no-build --logger "trx;LogFileName=application.trx"

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: dotnet test tests/Gym.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Migration model check (no pending model changes)
        run: dotnet ef migrations has-pending-model-changes --project src/Gym.Infrastructure --startup-project src/Gym.Api

      - name: Migration apply check (fresh PostgreSQL)
        env:
          WTG_CONNECTIONSTRING: "Host=localhost;Port=5432;Database=whatthegym_ci;Username=wtg_ci;Password=wtg_ci_password"
        run: dotnet ef database update --project src/Gym.Infrastructure --startup-project src/Gym.Api --connection "$WTG_CONNECTIONSTRING"

      # CONSTRAINTS publish gate: build/verify the deployable artifact only —
      # no push, no deploy until the ghcr.io registry is deliberately configured.
      - name: Publish artifact (verify only)
        run: dotnet publish src/Gym.Api -c Release --no-build -o ../artifacts/api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/**/TestResults/*.trx

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t whatthegym-api:ci backend

      - name: Trivy image scan (high/critical block)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: whatthegym-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy filesystem scan (report low/medium, non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: LOW,MEDIUM

  publish:
    # Build/verify artifacts and images only. No registry push and no deployment
    # until an Azure registry and credentials are deliberately configured.
    name: Publish (build artifacts, no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish backend/src/Gym.Api -c Release -o publish/api

      - name: Build API container image (verification only)
        run: docker build -t whatthegym-api:${{ github.sha }} backend

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish/api
          retention-days: 7
