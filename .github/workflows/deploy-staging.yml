name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: staging
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/erionpolisi/whatthegym-api
  WEB_IMAGE: ghcr.io/erionpolisi/whatthegym-web
  AZURE_CLIENT_ID: 1eadc1e4-6c71-4243-bc62-c01b2e8b300f
  AZURE_TENANT_ID: 084fcc17-2a37-4c44-968f-5b2d634b2b6f
  AZURE_SUBSCRIPTION_ID: 2c22e599-1307-4cc9-9a79-69c164310cb9

jobs:
  deploy:
    name: Build, publish, deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: api-build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=staging-api
          cache-to: type=gha,mode=max,scope=staging-api

      - name: Build and publish staging frontend image
        id: staging-web-build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.source.outputs.sha }}-staging
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api-staging.whatthegym.at
            NEXT_PUBLIC_SITE_URL=https://staging.whatthegym.at
            NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED=true
            NEXT_PUBLIC_ENABLE_DEV_LOGIN=false
          cache-from: type=gha,scope=staging-web
          cache-to: type=gha,mode=max,scope=staging-web

      - name: Build and publish production frontend image
        id: production-web-build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.source.outputs.sha }}-production
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.whatthegym.at
            NEXT_PUBLIC_SITE_URL=https://whatthegym.at
            NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED=true
            NEXT_PUBLIC_ENABLE_DEV_LOGIN=false
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        shell: bash
        run: |
          revision=$(az containerapp update \
            --resource-group wtg-staging \
            --name wtg-staging-api \
            --image "${API_IMAGE}@${{ steps.api-build.outputs.digest }}" \
            --query properties.latestRevisionName \
            --output tsv)
          for attempt in {1..60}; do
            state=$(az containerapp revision show \
              --resource-group wtg-staging \
              --name wtg-staging-api \
              --revision "$revision" \
              --query properties.provisioningState \
              --output tsv)
            if [[ "$state" == "Provisioned" ]]; then exit 0; fi
            if [[ "$state" == "ProvisioningFailed" || "$state" == "Failed" ]]; then exit 1; fi
            sleep 10
          done
          echo "API revision did not become healthy in time." >&2
          exit 1

      - name: Deploy frontend
        shell: bash
        run: |
          revision=$(az containerapp update \
            --resource-group wtg-staging \
            --name wtg-staging-web \
            --image "${WEB_IMAGE}@${{ steps.staging-web-build.outputs.digest }}" \
            --query properties.latestRevisionName \
            --output tsv)
          for attempt in {1..60}; do
            state=$(az containerapp revision show \
              --resource-group wtg-staging \
              --name wtg-staging-web \
              --revision "$revision" \
              --query properties.provisioningState \
              --output tsv)
            if [[ "$state" == "Provisioned" ]]; then exit 0; fi
            if [[ "$state" == "ProvisioningFailed" || "$state" == "Failed" ]]; then exit 1; fi
            sleep 10
          done
          echo "Frontend revision did not become healthy in time." >&2
          exit 1

      - name: Create staged release manifest
        shell: bash
        run: |
          mkdir -p staged-release
          jq --null-input \
            --arg sourceSha "${{ steps.source.outputs.sha }}" \
            --arg apiImage "${API_IMAGE}@${{ steps.api-build.outputs.digest }}" \
            --arg stagingWebImage "${WEB_IMAGE}@${{ steps.staging-web-build.outputs.digest }}" \
            --arg productionWebImage "${WEB_IMAGE}@${{ steps.production-web-build.outputs.digest }}" \
            '{
              sourceSha: $sourceSha,
              apiImage: $apiImage,
              stagingWebImage: $stagingWebImage,
              productionWebImage: $productionWebImage
            }' > staged-release/manifest.json

      - name: Publish staged release manifest
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ steps.source.outputs.sha }}
          path: staged-release/manifest.json
          if-no-files-found: error
          retention-days: 90
